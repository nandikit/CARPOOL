<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hassan Carpool</title>
<style>body{font-family:Arial;background:#f4f6f8;margin:0}.box{max-width:420px;margin:70px auto;background:#fff;padding:28px;border-radius:18px}input,button{width:100%;padding:14px;margin:7px 0;box-sizing:border-box;border-radius:10px;border:1px solid #ccc}button{background:#111;color:white;border:0;font-weight:bold}h1{text-align:center}.err{color:#b00020}</style></head>
<body><div class="box"><h1>🚗 HASSAN CARPOOL</h1><p>Global Carpool Login</p>{% if error %}<p class="err">{{error}}</p>{% endif %}
<form method="post"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>LOGIN</button></form></div></body></html>
